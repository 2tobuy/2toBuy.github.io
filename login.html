<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试注册 - 2toBuy</title>
    <style>
        body { padding: 50px; font-family: Arial; }
        .form { max-width: 300px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #e63946; color: white; border: none; cursor: pointer; }
        #tip { margin-top: 15px; color: red; text-align: center; }
    </style>
</head>
<body>
    <div class="form">
        <h2>测试注册</h2>
        <div class="form-group">
            <input type="text" id="username" placeholder="用户名">
        </div>
        <div class="form-group">
            <input type="password" id="password" placeholder="密码（≥6位）">
        </div>
        <button onclick="testRegister()">注册</button>
        <div id="tip"></div>
    </div>

    <!-- 用最新版 Bmob SDK -->
    <script src="https://cdn.jsdelivr.net/npm/bmob-js-sdk@3.0.29/dist/Bmob.min.js"></script>
    <script>
        // 替换成你自己的密钥（确认没错再粘贴）
        Bmob.initialize("66550a044b1eed3f1608509185379b35", "2a304029acc2e5c138b54cead7a9204a");

        function testRegister() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const tip = document.getElementById('tip');
            
            if (!username || password.length < 6) {
                tip.innerText = "用户名不能为空，密码≥6位！";
                return;
            }

            tip.innerText = "正在注册...";
            const user = Bmob.User();
            user.set("username", username);
            user.set("password", password);

            // 极简注册逻辑，只保留核心
            user.signUp().then(res => {
                tip.innerText = "注册成功！用户ID：" + res.objectId;
                // 跳转到小屋
                window.location.href = `user-cabin.html?userId=${res.objectId}`;
            }).catch(error => {
                tip.innerText = "注册失败：" + error.message;
            });
        }
    </script>
</body>
</html>
