<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录/注册 - 2toBuy</title>
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", "PingFang SC", sans-serif;
        }

        /* 页面背景：2toBuy 品牌风格图片 + 半透明遮罩 */
        body {
            min-height: 100vh;
            background: url('https://picsum.photos/id/1068/1920/1080') no-repeat center center fixed;
            background-size: cover;
            position: relative;
        }
        /* 背景遮罩（让登录框更清晰） */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.85);
            z-index: 1;
        }

        /* 2toBuy Logo 展示（左侧） */
        .logo-container {
            position: absolute;
            top: 50%;
            left: 10%;
            transform: translateY(-50%);
            z-index: 2;
        }
        .main-logo {
            font-size: 60px;
            font-weight: bold;
            color: #e63946;
            margin-bottom: 20px;
        }
        .logo-slogan {
            font-size: 20px;
            color: #333;
            line-height: 1.6;
        }

        /* 登录/注册卡片（右侧+缩小） */
        .auth-container {
            width: 350px; /* 缩小宽度 */
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            position: absolute;
            top: 50%;
            right: 10%; /* 移到右侧 */
            transform: translateY(-50%);
            z-index: 2;
        }

        /* 卡片顶部装饰 */
        .auth-container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #e63946, #ff7e67);
        }

        /* 表单标题 */
        .auth-title {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
            font-size: 20px;
            font-weight: 600;
            position: relative;
        }
        .auth-title::after {
            content: "";
            display: block;
            width: 40px;
            height: 2px;
            background: #e63946;
            margin: 8px auto 0;
            border-radius: 2px;
        }

        /* 表单组样式 */
        .form-group {
            margin-bottom: 18px;
            position: relative;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-size: 13px;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
            background-color: #f9f9f9;
        }
        .form-group input:focus {
            outline: none;
            border-color: #e63946;
            box-shadow: 0 0 0 3px rgba(230, 57, 70, 0.1);
            background-color: white;
        }

        /* 提交按钮 */
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #e63946, #ff7e67);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 8px;
        }
        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(230, 57, 70, 0.2);
        }
        .btn-submit:active {
            transform: translateY(0);
        }

        /* 切换标签样式 */
        .tab-switch {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 13px;
        }
        .tab-switch a {
            color: #e63946;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }
        .tab-switch a:hover {
            color: #c1121f;
            text-decoration: underline;
        }

        /* 错误提示 */
        .error-tip {
            color: #e63946;
            text-align: center;
            margin-bottom: 18px;
            padding: 10px;
            background-color: #fff5f5;
            border-radius: 6px;
            border: 1px solid #ffd4d4;
            display: none;
            font-size: 13px;
        }

        /* 响应式适配（手机端） */
        @media (max-width: 900px) {
            /* 手机端：logo上移，登录框居中 */
            .logo-container {
                top: 50px;
                left: 50%;
                transform: translateX(-50%);
                text-align: center;
            }
            .main-logo {
                font-size: 40px;
            }
            .logo-slogan {
                font-size: 16px;
            }
            .auth-container {
                width: 90%;
                max-width: 350px;
                top: 50%;
                left: 50%;
                right: auto;
                transform: translate(-50%, -50%);
                margin-top: 50px;
            }
        }
    </style>
</head>
<body>
    <!-- 左侧 2toBuy Logo 展示 -->
    <div class="logo-container">
        <div class="main-logo">2toBuy</div>
        <div class="logo-slogan">
            二手好物交易平台<br>
            买卖闲置，让好物更有价值
        </div>
    </div>

    <!-- 右侧登录/注册表单 -->
    <div class="auth-container">
        <div class="error-tip" id="errorTip"></div>
        
        <!-- 登录表单 -->
        <div id="loginForm">
            <h2 class="auth-title">用户登录</h2>
            <div class="form-group">
                <label for="loginUsername">用户名</label>
                <input type="text" id="loginUsername" placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label for="loginPassword">密码</label>
                <input type="password" id="loginPassword" placeholder="请输入密码">
            </div>
            <button class="btn-submit" onclick="login()">登录</button>
            <div class="tab-switch">
                还没有账号？<a href="javascript:switchTab('register')">立即注册</a>
            </div>
        </div>

        <!-- 注册表单 -->
        <div id="registerForm" style="display: none;">
            <h2 class="auth-title">用户注册</h2>
            <div class="form-group">
                <label for="regUsername">用户名</label>
                <input type="text" id="regUsername" placeholder="请设置用户名">
            </div>
            <div class="form-group">
                <label for="regPassword">密码</label>
                <input type="password" id="regPassword" placeholder="请设置密码（不少于6位）">
            </div>
            <button class="btn-submit" onclick="register()">注册</button>
            <div class="tab-switch">
                已有账号？<a href="javascript:switchTab('login')">立即登录</a>
            </div>
        </div>
    </div>

    <!-- 引入 Bmob SDK -->
    <script src="https://cdn.jsdelivr.net/npm/bmob-js-sdk@3.0.25/dist/Bmob.min.js"></script>
    <script>
        // 初始化 Bmob
        Bmob.initialize("66550a044b1eed3f1608509185379b35", "2a304029acc2e5c138b54cead7a9204a");

        // 获取URL参数函数
        function getUrlParam(name) {
            const reg = new RegExp(`(^|&)${name}=([^&]*)(&|$)`);
            const r = window.location.search.substr(1).match(reg);
            return r ? decodeURIComponent(r[2]) : null;
        }

        // 切换登录/注册标签
        function switchTab(type) {
            if (type === 'login') {
                document.getElementById('loginForm').style.display = 'block';
                document.getElementById('registerForm').style.display = 'none';
            } else {
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('registerForm').style.display = 'block';
            }
            document.getElementById('errorTip').style.display = 'none';
        }

        // 注册功能
        function register() {
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            
            // 简单验证
            if (!username || !password || password.length < 6) {
                showError('用户名不能为空，密码不少于6位！');
                return;
            }

            // 创建 Bmob 用户
            const user = Bmob.User();
            user.set("username", username);
            user.set("password", password);
            
            user.signUp().then(res => {
                // 注册成功，跳转到自己的小屋
                alert('注册成功！自动为你创建专属二手小屋～');
                const redirect = getUrlParam('redirect') || `user-cabin.html?userId=${res.objectId}`;
                window.location.href = redirect;
            }).catch(error => {
                showError('注册失败：' + error.message);
            });
        }

        // 登录功能
        function login() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            
            if (!username || !password) {
                showError('用户名和密码不能为空！');
                return;
            }

            // Bmob 用户登录
            Bmob.User.logIn(username, password).then(res => {
                // 登录成功，跳转到自己的小屋
                alert('登录成功！进入你的专属二手小屋～');
                const redirect = getUrlParam('redirect') || `user-cabin.html?userId=${res.objectId}`;
                window.location.href = redirect;
            }).catch(error => {
                showError('登录失败：' + error.message);
            });
        }

        // 显示错误提示
        function showError(msg) {
            const errorTip = document.getElementById('errorTip');
            errorTip.textContent = msg;
            errorTip.style.display = 'block';
            // 自动隐藏错误提示（3秒后）
            setTimeout(() => {
                errorTip.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
