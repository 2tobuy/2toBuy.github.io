<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录/注册 - 2toBuy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", "PingFang SC", sans-serif;
        }
        body {
            min-height: 100vh;
            background: url('https://picsum.photos/id/1068/1920/1080') no-repeat center center fixed;
            background-size: cover;
            position: relative;
        }
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.85);
            z-index: 1;
        }
        .logo-container {
            position: absolute;
            top: 50%;
            left: 10%;
            transform: translateY(-50%);
            z-index: 2;
        }
        .main-logo {
            font-size: 60px;
            font-weight: bold;
            color: #e63946;
            margin-bottom: 20px;
        }
        .logo-slogan {
            font-size: 20px;
            color: #333;
            line-height: 1.6;
        }
        .auth-container {
            width: 350px;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            position: absolute;
            top: 50%;
            right: 10%;
            transform: translateY(-50%);
            z-index: 2;
        }
        .auth-container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #e63946, #ff7e67);
        }
        .auth-title {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
            font-size: 20px;
            font-weight: 600;
            position: relative;
        }
        .auth-title::after {
            content: "";
            display: block;
            width: 40px;
            height: 2px;
            background: #e63946;
            margin: 8px auto 0;
            border-radius: 2px;
        }
        .form-group {
            margin-bottom: 18px;
            position: relative;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-size: 13px;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
            background-color: #f9f9f9;
        }
        .form-group input:focus {
            outline: none;
            border-color: #e63946;
            box-shadow: 0 0 0 3px rgba(230, 57, 70, 0.1);
            background-color: white;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #e63946, #ff7e67);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 8px;
        }
        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(230, 57, 70, 0.2);
        }
        .btn-submit:active {
            transform: translateY(0);
        }
        .tab-switch {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 13px;
        }
        .tab-switch a {
            color: #e63946;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }
        .tab-switch a:hover {
            color: #c1121f;
            text-decoration: underline;
        }
        .tip-box {
            text-align: center;
            margin-bottom: 18px;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            display: none;
        }
        .tip-error {
            color: #e63946;
            background-color: #fff5f5;
            border: 1px solid #ffd4d4;
        }
        .tip-success {
            color: #10b981;
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
        }
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .btn-loading {
            pointer-events: none;
            opacity: 0.8;
        }
        @media (max-width: 900px) {
            .logo-container {
                top: 50px;
                left: 50%;
                transform: translateX(-50%);
                text-align: center;
            }
            .main-logo {
                font-size: 40px;
            }
            .logo-slogan {
                font-size: 16px;
            }
            .auth-container {
                width: 90%;
                max-width: 350px;
                top: 50%;
                left: 50%;
                right: auto;
                transform: translate(-50%, -50%);
                margin-top: 50px;
            }
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <div class="main-logo">2toBuy</div>
        <div class="logo-slogan">
            二手好物交易平台<br>
            买卖闲置，让好物更有价值
        </div>
    </div>

    <div class="auth-container">
        <div class="tip-box tip-error" id="errorTip"></div>
        <div class="tip-box tip-success" id="successTip"></div>
        
        <div id="loginForm">
            <h2 class="auth-title">用户登录</h2>
            <div class="form-group">
                <label for="loginUsername">用户名</label>
                <input type="text" id="loginUsername" placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label for="loginPassword">密码</label>
                <input type="password" id="loginPassword" placeholder="请输入密码">
            </div>
            <div style="text-align:right;margin:-10px 0 15px;">
                <a href="javascript:showTip('success','演示模式：无需找回密码')" style="color:#2563eb;font-size:12px;">忘记密码？</a>
            </div>
            <button class="btn-submit" onclick="login()">登录</button>
            <div class="tab-switch">
                还没有账号？<a href="javascript:switchTab('register')">立即注册</a>
            </div>
        </div>

        <div id="registerForm" style="display: none;">
            <h2 class="auth-title">用户注册</h2>
            <div class="form-group">
                <label for="regUsername">用户名 <span style="color:#e63946;">*</span></label>
                <input type="text" id="regUsername" placeholder="请设置用户名（2-10个字符）">
            </div>
            <div class="form-group">
                <label for="regEmail">邮箱（选填）</label>
                <input type="email" id="regEmail" placeholder="请输入你的邮箱">
            </div>
            <div class="form-group">
                <label for="regPassword">密码 <span style="color:#e63946;">*</span></label>
                <input type="password" id="regPassword" placeholder="请设置密码（不少于6位）">
            </div>
            <div class="form-group">
                <label for="regPassword2">确认密码 <span style="color:#e63946;">*</span></label>
                <input type="password" id="regPassword2" placeholder="请再次输入密码">
            </div>
            <button class="btn-submit" onclick="register()">注册</button>
            <div class="tab-switch">
                已有账号？<a href="javascript:switchTab('login')">立即登录</a>
            </div>
        </div>
    </div>

<script>
// ====================== 本地注册/登录（永远不卡）======================
function switchTab(type) {
    hideAllTips();
    if (type === 'login') {
        document.getElementById('loginForm').style.display = 'block';
        document.getElementById('registerForm').style.display = 'none';
    } else {
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('registerForm').style.display = 'block';
    }
}

function showTip(type, msg) {
    hideAllTips();
    const el = document.getElementById(type + 'Tip');
    el.innerText = msg;
    el.style.display = 'block';
    setTimeout(() => { el.style.display = 'none' }, 2500);
}

function hideAllTips() {
    document.getElementById('errorTip').style.display = 'none';
    document.getElementById('successTip').style.display = 'none';
}

// 注册
function register() {
    const u = document.getElementById('regUsername').value.trim();
    const p = document.getElementById('regPassword').value.trim();
    const p2 = document.getElementById('regPassword2').value.trim();

    if (!u || u.length < 2 || u.length > 10) {
        showTip('error', '用户名 2-10 位');
        return;
    }
    if (!p || p.length < 6) {
        showTip('error', '密码至少 6 位');
        return;
    }
    if (p !== p2) {
        showTip('error', '两次密码不一致');
        return;
    }

    // 本地保存
    localStorage.setItem('username', u);
    localStorage.setItem('password', p);

    showTip('success', '注册成功！正在跳转…');
    setTimeout(() => {
        window.location.href = 'user-cabin.html?userId=LOCALUSER';
    }, 1000);
}

// 登录
function login() {
    const u = document.getElementById('loginUsername').value.trim();
    const p = document.getElementById('loginPassword').value.trim();

    const localUser = localStorage.getItem('username');
    const localPwd = localStorage.getItem('password');

    if (!u || !p) {
        showTip('error', '请输入账号密码');
        return;
    }

    if (u === localUser && p === localPwd) {
        showTip('success', '登录成功！');
        setTimeout(() => {
            window.location.href = 'user-cabin.html?userId=LOCALUSER';
        }, 1000);
    } else {
        showTip('error', '账号或密码错误');
    }
}
</script>
</body>
</html>
