<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>我的二手商品网站</title>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
    <div class="logo">二手好物交易</div>
    <ul class="nav-links">
        <li><a href="index.html">首页</a></li>
        <li><a href="users.html">用户小屋</a></li>
        <li><a href="login.html">登录/注册</a></li>
    </ul>
</nav>

    <!-- 首页横幅 -->
    <section id="home" class="hero">
        <h1>闲置好物，低价转让</h1>
        <p>省心筛选，放心交易</p>
    </section>

    <!-- 二手商品筛选栏 -->
    <section class="filter-bar">
        <div class="filter-container">
            <h3>筛选商品</h3>
            <div class="filter-options">
                <select id="category-select">
                    <option value="all">全部分类</option>
                    <option value="electronics">电子产品</option>
                    <option value="furniture">家具</option>
                    <option value="clothes">服饰</option>
                </select>
                <button id="filter-btn">筛选</button>
            </div>
        </div>
    </section>

    <!-- 二手商品列表 -->
    <section id="goods" class="goods-list">
        <h2>二手商品列表</h2>
        <div class="goods-grid">
            <!-- 商品1 -->
            <div class="goods-item" data-category="electronics">
                <img src="https://picsum.photos/300/200?random=1" alt="二手手机">
                <h4>iPhone 13 128G</h4>
                <p class="price">¥3500</p>
                <p class="desc">95新，电池健康88%，无拆无修</p>
                <button class="detail-btn">查看详情</button>
            </div>
            <!-- 商品2 -->
            <div class="goods-item" data-category="furniture">
                <img src="https://picsum.photos/300/200?random=2" alt="二手沙发">
                <h4>北欧布艺沙发</h4>
                <p class="price">¥800</p>
                <p class="desc">三人位，使用1年，无破损，自提</p>
                <button class="detail-btn">查看详情</button>
            </div>
            <!-- 商品3 -->
            <div class="goods-item" data-category="clothes">
                <img src="https://picsum.photos/300/200?random=3" alt="二手卫衣">
                <h4>优衣库加绒卫衣</h4>
                <p class="price">¥50</p>
                <p class="desc">M码，穿过2次，洗干净无污渍</p>
                <button class="detail-btn">查看详情</button>
            </div>
        </div>
    </section>

    <!-- 联系我 -->
    <section id="contact" class="contact">
        <h2>联系我</h2>
        <p>交易咨询：2tobuy@example.com</p>
    </section>

    <!-- 商品详情弹窗（默认隐藏） -->
    <div id="detail-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h3 id="modal-title">商品详情</h3>
            <img id="modal-img" src="" alt="商品图片" style="width:100%;max-width:400px;">
            <p id="modal-price"></p>
            <p id="modal-desc"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
